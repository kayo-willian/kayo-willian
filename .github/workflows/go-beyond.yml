name: GO BEYOND

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/go-beyond.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current main build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: go-beyond-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python portfolio/build.py
      - run: |
          test -s portfolio/dist/index.html
          test -s portfolio/dist/en/index.html
          test -s portfolio/dist/style.css
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          path: portfolio/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
