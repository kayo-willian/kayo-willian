name: GO BEYOND

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/go-beyond.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-beyond-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare NOC photograph from pinned source
        run: |
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/kayo-willian/enterprise-noc-from-scratch/ac78e0465a0ef15c90c7669a4bcf0b5/docs/assets/images/physical/cisco-router-switch-patch-panel.jpg' -o "$RUNNER_TEMP/noc-source.jpg"
          test "$(git hash-object "$RUNNER_TEMP/noc-source.jpg")" = d4636bb45e4d3364478c15120a0f66db4ddc9517
          python -m pip install 'Pillow>=12,<13'
          python portfolio/generator/evidence.py "$RUNNER_TEMP/noc-source.jpg" portfolio/assets/images/noc-rack.webp
      - name: Build static HTML and validate links
        run: python3 portfolio/build.py
      - name: Install Chromium test runner
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps --only-shell chromium
      - name: Check both languages and five viewport widths
        run: python portfolio/tests/browser.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: portfolio/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
