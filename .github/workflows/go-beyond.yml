name: GO BEYOND

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/go-beyond.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-beyond-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: portfolio
        run: npm install --no-audit --no-fund
      - name: Build Astro
        working-directory: portfolio
        run: npm run build
      - name: Validate output
        run: python3 portfolio/build.py --check
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: portfolio/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
